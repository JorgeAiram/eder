name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Pint Formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo, pdo_sqlite, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint (Code Style & Quality)
        run: vendor/bin/pint --test

  automated-tests:
    name: Automated Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: laravel_testing_db
          MYSQL_ROOT_PASSWORD: root_testing_secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo, pdo_mysql, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_testing_db
          DB_USERNAME: root
          DB_PASSWORD: root_testing_secret
        run: php artisan migrate --force

      - name: Run Test Suite (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_testing_db
          DB_USERNAME: root
          DB_PASSWORD: root_testing_secret
        run: php artisan test
